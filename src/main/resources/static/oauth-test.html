<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google OAuth Test</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fb;
        color: #172033;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      main {
        width: min(720px, 100%);
        background: #ffffff;
        border: 1px solid #d9deea;
        border-radius: 8px;
        box-shadow: 0 18px 50px rgb(23 32 51 / 10%);
        padding: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.25;
      }

      p {
        margin: 0 0 20px;
        color: #5c667a;
        line-height: 1.6;
      }

      button,
      a.button {
        appearance: none;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #ffffff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
      }

      button.secondary {
        background: #eef2ff;
        color: #1e3a8a;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }

      dl {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 8px 12px;
        margin: 20px 0;
      }

      dt {
        color: #6b7280;
        font-weight: 700;
      }

      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      pre {
        margin: 0;
        min-height: 160px;
        overflow: auto;
        border-radius: 6px;
        background: #111827;
        color: #e5e7eb;
        padding: 16px;
        font-size: 13px;
        line-height: 1.5;
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        border-radius: 999px;
        padding: 0 10px;
        background: #f1f5f9;
        color: #334155;
        font-size: 13px;
        font-weight: 700;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #0f172a;
          color: #e5e7eb;
        }

        main {
          background: #111827;
          border-color: #263244;
          box-shadow: none;
        }

        p,
        dt {
          color: #aab3c5;
        }

        pre {
          background: #050816;
          border: 1px solid #263244;
        }

        .status {
          background: #1e293b;
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Google OAuth Test</h1>
      <p>Google 로그인 후 받은 임시 code를 백엔드 토큰으로 교환합니다.</p>

      <div class="actions">
        <a class="button" href="oauth2/authorization/google">Google로 로그인</a>
        <button id="exchangeButton" class="secondary" type="button">code 다시 교환</button>
      </div>

      <span id="status" class="status">대기 중</span>

      <dl>
        <dt>code</dt>
        <dd id="code">없음</dd>
        <dt>user</dt>
        <dd id="user">없음</dd>
      </dl>

      <pre id="result">{}</pre>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const statusElement = document.querySelector("#status");
      const codeElement = document.querySelector("#code");
      const userElement = document.querySelector("#user");
      const resultElement = document.querySelector("#result");
      const exchangeButton = document.querySelector("#exchangeButton");

      codeElement.textContent = code || "없음";

      function renderStatus(text) {
        statusElement.textContent = text;
      }

      function renderJson(value) {
        resultElement.textContent = JSON.stringify(value, null, 2);
      }

      async function exchangeCode() {
        if (!code) {
          renderStatus("code 없음");
          renderJson({ message: "Google 로그인 후 redirect 된 URL에 code 파라미터가 필요합니다." });
          return;
        }

        exchangeButton.disabled = true;
        renderStatus("토큰 교환 중");

        try {
          const response = await fetch("v1/auth/oauth/token", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code }),
          });
          const payload = await response.json();

          renderJson(payload);

          const user = payload?.data?.user;
          userElement.textContent = user ? `${user.name} <${user.email}>` : "없음";
          renderStatus(response.ok ? "성공" : `실패 ${response.status}`);
        } catch (error) {
          renderStatus("요청 실패");
          renderJson({ message: error.message });
        } finally {
          exchangeButton.disabled = false;
        }
      }

      exchangeButton.addEventListener("click", exchangeCode);
      exchangeCode();
    </script>
  </body>
</html>
