spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:interview_db}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

  cache:
    type: none

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope:
              - email
              - profile

logging:
  level:
    root: INFO
    com.interviewmirror: DEBUG
    org.hibernate.SQL: DEBUG

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:dummy}   # 환경변수에서 로드
      secret-key: ${AWS_SECRET_KEY:dummy}   # 환경변수에서 로드
    region:
      static: ap-northeast-2          # 서울 리전 (보통 고정해서 사용)
    s3:
      bucket: ${S3_BUCKET_NAME:dummy_name}       # 사용할 S3 버킷 이름
    stack:
      auto: false                     # 로컬/일반 서버 실행 시 EC2 메타데이터 체크 방지
      
jwt:
  secret: ${JWT_SECRET:change-this-secret-key-change-this-secret-key-123456789}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

oauth:
  success-redirect-url: ${OAUTH_SUCCESS_REDIRECT_URL:http://localhost:63342/oauth-success.html}
  code-expiration-ms: ${OAUTH_CODE_EXPIRATION_MS:180000}